name: Validate ChatGPT bootstrap

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate-chatgpt-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ChatGPT bootstrap
        run: python scripts/validate_chatgpt_bootstrap.py
